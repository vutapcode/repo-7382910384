name: Codespace Capability Probe

on:
  push:
    paths:
      - '.github/workflows/codespace-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_PAT || github.token }}
      TARGET_SHA: aea8753e8405491bfbd2cf48d44f80e73acf5312
    steps:
      - name: Verify exact commit inside Codespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/create.json
          import json, os
          print(json.dumps({
              'repository_id': 1335905093,
              'ref': os.environ['TARGET_SHA'],
              'idle_timeout_minutes': 10,
              'display_name': 'chatgpt-commit-verifier'
          }))
          PY

          gh api -X POST /user/codespaces --input /tmp/create.json > /tmp/created.json
          CS=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/created.json'))['name'])
          PY
          )
          echo "codespace_created=$CS"

          cleanup() {
            echo "cleanup_delete=$CS"
            gh api -X DELETE "/user/codespaces/$CS" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 36); do
            gh api "/user/codespaces/$CS" > /tmp/state.json
            STATE=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/state.json')).get('state'))
          PY
            )
            echo "poll=$i state=$STATE"
            if [ "$STATE" = "Available" ]; then READY=1; break; fi
            if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "Failed" ]; then break; fi
            sleep 5
          done
          test "$READY" -eq 1

          gh codespace ssh -c "$CS" -- bash -lc "set -e; cd /workspaces/repo-7382910384; echo CODE_EXEC_OK; ACTUAL=\$(git rev-parse HEAD); echo target=$TARGET_SHA; echo actual=\$ACTUAL; test \"\$ACTUAL\" = \"$TARGET_SHA\"; git status --short; python3 -m compileall -q .; echo COMPILE_OK"
          echo "exact_commit_verify=OK"
