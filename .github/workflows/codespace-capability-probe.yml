name: Codespace Capability Probe

on:
  push:
    paths:
      - '.github/workflows/codespace-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_PAT || github.token }}
    steps:
      - name: Create execute delete Codespace
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_OS repo=$GITHUB_REPOSITORY"
          gh --version | head -n 1

          cat > /tmp/create.json <<'JSON'
          {
            "repository_id": 1335905093,
            "ref": "main",
            "idle_timeout_minutes": 10,
            "display_name": "chatgpt-capability-probe"
          }
          JSON

          gh api -X POST /user/codespaces --input /tmp/create.json > /tmp/created.json
          CS=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/created.json'))
          print(d['name'])
          PY
          )
          echo "codespace_created=$CS"

          cleanup() {
            echo "cleanup_delete=$CS"
            gh api -X DELETE "/user/codespaces/$CS" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 36); do
            gh api "/user/codespaces/$CS" > /tmp/state.json
            STATE=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/state.json')).get('state'))
          PY
            )
            echo "poll=$i state=$STATE"
            if [ "$STATE" = "Available" ]; then READY=1; break; fi
            if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "Failed" ]; then break; fi
            sleep 5
          done

          test "$READY" -eq 1
          echo "codespace_ready=YES"
          gh codespace ssh -c "$CS" -- bash -lc 'echo CODE_EXEC_OK; pwd; git -C "$CODESPACE_VSCODE_FOLDER" rev-parse HEAD; uname -srm'
          echo "codespace_exec=OK"
